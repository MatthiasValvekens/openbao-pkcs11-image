name: Publish OpenBao (kms-pkcs11) container image
on:
  push:
    tags: [ "v*" ]
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  image-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.docker-meta.outputs.tags }}
      labels: ${{ steps.docker-meta.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read component versions from the Containerfile
        id: versions
        run: |
          bao="$(sed -n 's/^ARG OPENBAO_VERSION=//p' Containerfile)"
          plugin="$(sed -n 's/^ARG KMS_PKCS11_VERSION=//p' Containerfile)"
          echo "bao=$bao" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
      - id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the image name
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.versions.outputs.bao }}-pkcs11-${{ steps.versions.outputs.plugin }},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr
            type=semver,pattern={{version}},event=tag
  run-build:
    runs-on: ubuntu-latest
    needs: [image-meta]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        # arm64 only: the final stage runs apt-get and the smoke check under emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          # PRs build both arches to prove the recipe, but do not publish
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ needs.image-meta.outputs.tags }}
          labels: ${{ needs.image-meta.outputs.labels }}
          cache-to: type=gha,mode=max
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64/v8
      - name: Sign images using GHA OIDC identity
        if: github.event_name != 'pull_request'
        # this digest is for the manifest list that combines all the platform images
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        # registry names must be lowercase, github.repository may not be
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
