name: Publish OpenTofu runner container image
on:
  push:
    tags: [ "v*" ]
    branches: [ master ]
    paths: [ "tofu/**", ".github/workflows/tofu-image.yml", ".github/actions/build-image/**" ]
  pull_request:
    branches: [ master ]
    paths: [ "tofu/**", ".github/workflows/tofu-image.yml", ".github/actions/build-image/**" ]
  workflow_dispatch: {}

jobs:
  guard-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the plan guard
        run: |
          shellcheck tofu/tofu-destroy-guard tofu/test/guard-test.sh
          sh tofu/test/guard-test.sh
  build:
    runs-on: ubuntu-latest
    needs: [guard-test]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          context: tofu
          image: /tofu
          version-tag: ${TOFU_VERSION}-vault-${VAULT_PROVIDER_VERSION}
          token: ${{ secrets.GITHUB_TOKEN }}
