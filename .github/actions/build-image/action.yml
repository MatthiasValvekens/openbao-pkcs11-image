name: Build, publish and sign an image
description: >-
  Builds <context>/Containerfile for linux/amd64 and linux/arm64. Outside pull
  requests it pushes to ghcr.io/<repository><image> and signs the manifest list
  with keyless cosign. The caller checks out the repository and grants
  packages: write and id-token: write. A composite action rather than a reusable
  workflow, so the signing identity stays the calling workflow (one per image).
inputs:
  context:
    description: Image directory, holding the Containerfile; also the build context and the cache scope
    required: true
  image:
    description: Image name below ghcr.io/<repository>, e.g. "/tofu"; empty for the repository itself
    required: false
    default: ""
  version-tag:
    description: >-
      Tag naming the bundled component versions; each ${NAME} is replaced by the
      default of `ARG NAME=...` in the Containerfile, e.g.
      "${TOFU_VERSION}-vault-${VAULT_PROVIDER_VERSION}"
    required: true
  token:
    description: Token for pushing to ghcr.io
    required: true
runs:
  using: composite
  steps:
    - name: Resolve the image name and version tag
      id: resolve
      shell: bash
      env:
        CONTAINERFILE: ${{ inputs.context }}/Containerfile
        TEMPLATE: ${{ inputs.version-tag }}
        IMAGE_SUFFIX: ${{ inputs.image }}
      run: |
        set -euo pipefail
        tag="$TEMPLATE"
        while IFS='=' read -r name value; do
          tag="${tag//"\${$name}"/"$value"}"
        done < <(sed -n 's/^ARG \([A-Za-z_][A-Za-z0-9_]*\)=\(.*\)$/\1=\2/p' "$CONTAINERFILE")
        if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "::error::version tag '$tag' is not a valid tag (a placeholder without an ARG default in $CONTAINERFILE?)"
          exit 1
        fi
        echo "version-tag=$tag" >> "$GITHUB_OUTPUT"
        # registry names must be lowercase, github.repository may not be
        echo "image=ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
    - id: docker-meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.resolve.outputs.image }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=${{ steps.resolve.outputs.version-tag }},enable=${{ github.ref == 'refs/heads/master' }}
          type=sha,format=short,enable=${{ github.ref == 'refs/heads/master' }}
          type=ref,event=pr
          type=semver,pattern={{version}},event=tag
    - name: Install Cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Set up QEMU
      # arm64 only: the final stages run apt-get and build-time checks under emulation
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.token }}
    - name: Build and push
      id: build-push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Containerfile
        # PRs build both arches to prove the recipe, but do not publish
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker-meta.outputs.tags }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        cache-to: type=gha,mode=max,scope=${{ inputs.context }}
        cache-from: type=gha,scope=${{ inputs.context }}
        platforms: linux/amd64,linux/arm64/v8
    - name: Sign images using GHA OIDC identity
      if: github.event_name != 'pull_request'
      shell: bash
      # this digest is for the manifest list that combines all the platform images
      env:
        IMAGE: ${{ steps.resolve.outputs.image }}
        DIGEST: ${{ steps.build-push.outputs.digest }}
      run: cosign sign --yes "${IMAGE}@${DIGEST}"
